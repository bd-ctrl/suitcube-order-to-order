name: Fix Fabric Sheet URL
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update fabric sheet URL
        run: |
          python3 << 'EOF'
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          old = "https://docs.google.com/spreadsheets/d/1P7xAYauIfYNJq8GP5K8DeyeUYAUsERblCvfZRYQcEGc/export?format=csv&gid=71543023"
          new = "https://docs.google.com/spreadsheets/d/1X41oyjicFpiu_aJC5y-ibIMsB0stKF1n7CD1CnUUljA/export?format=csv&gid=0"
          if old in content:
              content = content.replace(old, new)
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Done: URL updated')
          else:
              print('WARNING: old URL not found')
          EOF
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix: update fabric sheet to new spreadsheet ID"
          git push || true
