name: Fix Font CSS
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix card-hd fonts
        run: |
          python3 << 'EOF'
          import re
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r"(\.card-hd-bold\{[^}]*?)font-family:'Quicksand',sans-serif", r"\1font-family:'Playwrite MX Guides',cursive", content)
          content = re.sub(r"(\.card-hd-italic\{[^}]*?)font-family:'Quicksand',sans-serif", r"\1font-family:'Playwrite MX Guides',cursive", content)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print('Font fix done!')
          EOF
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix: Playwrite MX Guides for section headings"
          git push || true
