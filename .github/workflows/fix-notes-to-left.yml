name: Fix Notes to Left Column
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move notes textarea to left column
        run: |
          echo "" | base64 -d | python3
      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix: Move notes textarea to left column (grid-column:1)"
          git push || true
