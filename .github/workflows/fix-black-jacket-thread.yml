name: Fix Black Jacket Thread Colors v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          echo "" | base64 -d | python3
      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix: Black Jacket sb_suit thread colors -> Classic Black (6)"
          git push || true
