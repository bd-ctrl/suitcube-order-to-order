name: Fix Notes Left
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move notes to left column
        run: |
          python3 << 'EOF'
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace(
              '<div style="padding:12px 16px 16px">',
              '<div style="padding:12px 16px 16px;grid-column:1">'
          )
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print('Done!')
          EOF
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix: move notes textarea to left column"
          git push || true
